name: perf-check
on:
  push:
    branches: ["perf-*"]
permissions:
  contents: write
jobs:
  smtp-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe mail servers
        run: |
          {
          for h in tonic.hostns.io ns1.hostns.io; do
            echo "##### $h  -> $(getent hosts $h | awk '{print $1}' | tr '\n' ' ')"
            for p in 465 587 25; do
              if timeout 8 bash -c "</dev/tcp/$h/$p" 2>/dev/null; then echo "port $p: OPEN"; else echo "port $p: closed/timeout"; fi
            done
            echo "--- TLS on 465:"
            echo QUIT | timeout 12 openssl s_client -connect $h:465 -servername $h -verify_return_error -brief 2>&1 | head -8
            echo "--- cert names on 465:"
            echo QUIT | timeout 12 openssl s_client -connect $h:465 -servername $h 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | head -6
            echo "--- STARTTLS on 587 banner/EHLO:"
            (echo "EHLO test.example"; sleep 2; echo QUIT) | timeout 10 openssl s_client -starttls smtp -connect $h:587 -servername $h -brief 2>&1 | head -6
          done
          } 2>&1 | tee test.txt
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/out && cp test.txt /tmp/out/ && echo "${GITHUB_SHA}" > /tmp/out/sha.txt
          cd /tmp/out && git init -q -b measure-results && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "results ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" measure-results
