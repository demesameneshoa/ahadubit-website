name: perf-check
on:
  push:
    branches: ["perf-*"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build 2>&1 | tee build.txt
      - run: npx --yes playwright@1.48.2 install chromium && npm i --no-save playwright@1.48.2
      - name: Verify
        run: |
          npx next start -p 3000 > server.txt 2>&1 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
          mkdir -p shots
          node scripts/verify.mjs > test.txt 2>&1 || true
          cat test.txt
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.txt test.txt /tmp/out/ 2>/dev/null || true
          cp -r shots /tmp/out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/out/sha.txt
          cd /tmp/out && git init -q -b measure-results && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "results ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" measure-results
