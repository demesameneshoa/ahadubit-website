name: perf-check
on:
  push:
    branches: ["perf-*"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Block Google Fonts (prove the build is self-contained)
        run: echo "0.0.0.0 fonts.googleapis.com fonts.gstatic.com" | sudo tee -a /etc/hosts
      - run: npm install --no-audit --no-fund
      - run: npm run build 2>&1 | tee build.txt
      - run: npx --yes playwright@1.48.2 install chromium && npm i --no-save playwright@1.48.2
      - name: Check fonts in the browser
        run: |
          npx next start -p 3000 > server.txt 2>&1 &
          npx --yes wait-on@8 http://localhost:3000 --timeout 60000
          mkdir -p shots
          cat > check.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = []; p.on("pageerror", (e) => errors.push(e.message));
          const fontReqs = []; p.on("response", (r) => { if (r.request().resourceType() === "font") fontReqs.push(r.status() + " " + r.url().replace("http://localhost:3000", "")); });
          await p.goto("http://localhost:3000/", { waitUntil: "networkidle" });
          await p.evaluate(() => document.fonts.ready);
          const info = await p.evaluate(() => {
            const h1 = document.querySelector("h1");
            const fam = getComputedStyle(h1).fontFamily;
            const loaded = [...document.fonts].filter((f) => f.status === "loaded").map((f) => f.family + " " + f.weight);
            return { fam, loaded, h1check: document.fonts.check("700 40px " + fam.split(",")[0]) };
          });
          console.log("h1 font-family:", info.fam);
          console.log("loaded faces:", info.loaded.join(" | "));
          console.log("font requests:", fontReqs.join(" | "));
          console.log((info.h1check && info.loaded.length >= 1 && errors.length === 0 ? "PASS" : "FAIL") + " headline font loaded; page errors=" + errors.length);
          await p.screenshot({ path: "shots/hero.png" });
          await b.close();
          JS
          node check.mjs > test.txt 2>&1 || true
          cat test.txt
      - name: Publish results
        if: always()
        run: |
          mkdir -p /tmp/out && cp build.txt test.txt /tmp/out/ 2>/dev/null || true
          cp -r shots /tmp/out/ 2>/dev/null || true
          echo "${GITHUB_SHA}" > /tmp/out/sha.txt
          cd /tmp/out && git init -q -b measure-results && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "results ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" measure-results
